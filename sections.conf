# Optional package section overrides.
#
# Format:
#   <Package>: <Section>
#
# The generated APT index (and therefore Sileo/Zebra) will use this Section
# instead of the one inside the .deb. The .deb itself is never modified.
# Package managers group packages by this value, so it can be used to create
# a separate section such as "Legacy Tweaks".

com.miron302.xenhtmlreborn: Legacy Tweaks
